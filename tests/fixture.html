<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="./runtime.js"></script>
    <script defer src="../dist/alpinejs-shopify-cart.js"></script>
    <script defer src="../node_modules/alpinejs/dist/cdn.js"></script>
  </head>
  <body>
    <main x-data="{ variantId: 123 }">
      <span data-ready x-text="$cart.ready"></span>
      <span data-quantity x-text="$cart.totalQuantity"></span>
      <span data-pending x-text="$cart.pending"></span>
      <button data-add @click="$cart.add({ merchandiseId: variantId, quantity: 2 }, { context: 'product' })">Add</button>
      <button data-open @click="$cart.open()">Open</button>
    </main>
    <aside x-data><span data-other-quantity x-text="$cart.totalQuantity"></span></aside>
  </body>
</html>
