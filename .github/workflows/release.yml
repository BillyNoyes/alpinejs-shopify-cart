name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dist_tag: ${{ steps.metadata.outputs.dist_tag }}
      tarball: ${{ steps.metadata.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Match tag, package, and lockfile
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          import {releaseMetadata} from './scripts/release-metadata.mjs';
          const metadata = releaseMetadata(
            JSON.parse(readFileSync('package.json', 'utf8')),
            process.env.GITHUB_REF,
            JSON.parse(readFileSync('package-lock.json', 'utf8')),
          );
          appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${metadata.version}\ndist_tag=${metadata.distTag}\ntarball=${metadata.tarball}\n`);
          NODE
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Build release tarball
    needs: [validate, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build && npm run test:package
      - name: Verify generated files
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - name: Pack release
        env:
          TARBALL: ${{ needs.validate.outputs.tarball }}
        run: |
          mkdir -p "$RUNNER_TEMP/cart-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/cart-release"
          test -f "$RUNNER_TEMP/cart-release/$TARBALL"
          test "$(find "$RUNNER_TEMP/cart-release" -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/cart-release/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [validate, package]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/alpinejs-shopify-cart
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/cart-release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      # Build and dependency lifecycle scripts run without the publish job's OIDC permission.
      - name: Publish prepared tarball with provenance
        working-directory: ${{ runner.temp }}/cart-release
        env:
          TARBALL: ${{ needs.validate.outputs.tarball }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: npm publish "$TARBALL" --ignore-scripts --access public --provenance --tag "$DIST_TAG" --registry=https://registry.npmjs.org/

  release:
    name: Create GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: |
          flags=(--latest)
          if [[ "$DIST_TAG" != latest ]]; then flags=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Alpine Shopify Cart $RELEASE_TAG" "${flags[@]}"
